name: Build Windows

on:
  workflow_call:
    inputs:
      release:
        description: Require a version tag matching package.json
        type: boolean
        default: false
    secrets:
      WIN_CSC_LINK:
        required: false
      WIN_CSC_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Check and package Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Validate version
        run: node .github/scripts/prepare-build.mjs
        env:
          REQUIRE_RELEASE_TAG: ${{ inputs.release }}

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck and build
        run: pnpm build

      - name: Test IPC and updates
        run: pnpm test:ipc

      - name: Test development update feed
        run: pnpm exec electron tests/updater.electron.cjs

      - name: Package Windows installer
        run: pnpm exec electron-builder --win nsis --x64 --publish never
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Verify update metadata
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $channel = if ($version.Contains('-')) { $version.Split('-')[1].Split('.')[0] } else { 'latest' }
          if (!(Test-Path -LiteralPath "dist/$channel.yml")) { throw 'Missing update metadata' }

      - name: Upload installer and update metadata
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-x64
          # 只上传安装包与各渠道更新文件，避免带入 builder 调试配置。
          path: |
            dist/*-setup.exe
            dist/latest.yml
            dist/alpha.yml
            dist/beta.yml
            dist/rc.yml
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
